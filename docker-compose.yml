# Amigo Secreto — tudo em um servidor: banco, migrações, app e HTTPS automático.
#   1. cp docker.env.example .env   (e preencha)
#   2. docker compose up -d --build
# Detalhes em docs/DEPLOY.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amigo
      POSTGRES_DB: amigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigo -d amigo"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
      args:
        APP_URL: ${APP_URL:?defina APP_URL no .env}
    environment:
      DATABASE_URL: postgresql://amigo:${POSTGRES_PASSWORD}@db:5432/amigo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        APP_URL: ${APP_URL}
        ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
        ADSENSE_SLOT_ID: ${ADSENSE_SLOT_ID:-}
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        AMAZON_ASSOCIATE_TAG: ${AMAZON_ASSOCIATE_TAG:-}
      OWNER_PANEL_PASSWORD: ${OWNER_PANEL_PASSWORD:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://amigo:${POSTGRES_PASSWORD}@db:5432/amigo
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      APP_URL: ${APP_URL}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_SLOT_ID: ${ADSENSE_SLOT_ID:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      AMAZON_ASSOCIATE_TAG: ${AMAZON_ASSOCIATE_TAG:-}
      # atrás do Caddy (proxy confiável): usa o IP real do visitante no rate limit
      TRUST_PROXY: "true"
      # processos do site (padrão: 1 por núcleo, até 8)
      APP_WORKERS: ${APP_WORKERS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
